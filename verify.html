<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Xác minh email đăng ký LacVietGames">
  <meta name="theme-color" content="#4f46e5">
  <title>Xác minh email | LacVietGames</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./flow.css">
</head>
<body class="flow-page">
  <main class="flow-shell">
    <section class="flow-card">
      <div class="flow-brand"><span>LV</span> LacVietGames</div>

      <div class="flow-steps" aria-label="Tiến trình đăng ký">
        <div class="flow-step done" title="Thông tin tài khoản"></div>
        <div class="flow-step active" title="Xác minh email"></div>
        <div class="flow-step" title="Hoàn tất"></div>
      </div>

      <div class="flow-icon">✉</div>
      <div class="flow-heading">
        <h1>Nhập mã xác thực</h1>
        <p>Mã gồm 6 chữ số đã được gửi tới email bên dưới.</p>
      </div>

      <div id="verificationEmail" class="flow-email">Đang tải...</div>

      <form id="verificationForm" class="flow-form" novalidate>
        <input
          id="verificationCode"
          class="flow-code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          aria-label="Mã xác thực 6 chữ số"
          required
        >
        <div id="codeError" class="flow-error"></div>
        <button id="verifyButton" class="flow-primary" type="submit">Xác nhận và tạo tài khoản</button>
      </form>

      <div id="verificationStatus" class="flow-status" role="status" aria-live="polite"></div>

      <div class="flow-links">
        <button id="resendButton" class="flow-link" type="button">Gửi lại mã</button>
        <a id="changeEmailLink" class="flow-link" href="./index.html?tab=register">Đổi email</a>
      </div>

      <div class="flow-note">
        Tài khoản chưa được ghi vào database ở bước này. Hệ thống chỉ tạo tài khoản sau khi mã xác thực chính xác.
      </div>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./verify.js"></script>
</body>
</html>
