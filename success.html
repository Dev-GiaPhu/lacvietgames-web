<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Đăng ký LacVietGames thành công">
  <meta name="theme-color" content="#4f46e5">
  <title>Đăng ký thành công | LacVietGames</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./flow.css">
</head>
<body class="flow-page">
  <main class="flow-shell">
    <section class="flow-card">
      <div class="flow-brand"><span>LV</span> LacVietGames</div>

      <div class="flow-steps" aria-label="Tiến trình đăng ký">
        <div class="flow-step done" title="Thông tin tài khoản"></div>
        <div class="flow-step done" title="Xác minh email"></div>
        <div class="flow-step active" title="Hoàn tất"></div>
      </div>

      <div class="flow-icon success">✓</div>
      <div class="flow-heading">
        <h1>Đăng ký thành công!</h1>
        <p>Email đã được xác minh và tài khoản LacVietGames đã được tạo trong database.</p>
      </div>

      <div class="success-details">
        <div>
          <small>Họ và tên</small>
          <strong id="successName">Tài khoản mới</strong>
        </div>
        <div>
          <small>Email</small>
          <strong id="successEmail">Đã xác minh</strong>
        </div>
      </div>

      <a class="flow-primary" href="./index.html" style="display:grid;place-items:center;text-decoration:none;">Đăng nhập ngay</a>
      <a class="flow-secondary" href="./index.html?tab=register" style="display:grid;place-items:center;text-decoration:none;">Tạo tài khoản khác</a>
    </section>
  </main>

  <script src="./success.js"></script>
</body>
</html>
