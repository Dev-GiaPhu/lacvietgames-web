name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              ./vendor/*) continue ;;
              *.js) node --check "$file" ;;
            esac
          done < <(find . -type f -name '*.js' -print0)
      - name: Validate Unity package metadata
        run: node -e "const p=require('./sdk/unity-package/package.json'); if(!p.name||!p.version||!p.unity) process.exit(1); console.log(p.name,p.version,p.unity)"
      - name: Ensure production SDK has no embedded secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '(Storage__R2__SecretAccessKey|Payment:PayOS:ApiKey|Payment:PayOS:ChecksumKey|MYSQLPASSWORD|Store:SessionSecret|lvg_sk_[A-Za-z0-9_-]{20,})' sdk/unity-package --exclude='README.md'; then
            echo 'Potential secret material found in Unity package.'
            exit 1
          fi
      - name: Production connectivity smoke test
        shell: bash
        run: |
          set -euo pipefail
          API='https://lacvietgames-api-production.up.railway.app'
          ORIGIN='https://dev-giaphu.github.io'

          curl --fail --silent --show-error --max-time 15 "$API/health/live" | tee /tmp/live.json
          grep -q '"success":true' /tmp/live.json

          curl --fail --silent --show-error --max-time 15 "$API/health" | tee /tmp/ready.json
          grep -q '"success":true' /tmp/ready.json
          grep -q '"database":"ready"' /tmp/ready.json

          curl --fail --silent --show-error --max-time 15 \
            -H "Origin: $ORIGIN" \
            "$API/api/store/games" \
            -D /tmp/games.headers -o /tmp/games.json
          grep -qi '^access-control-allow-origin: https://dev-giaphu.github.io' /tmp/games.headers
          grep -q '"success":true' /tmp/games.json

          curl --silent --show-error --max-time 15 -X OPTIONS \
            "$API/api/store/auth/login" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -D /tmp/cors.headers -o /dev/null
          grep -qi '^access-control-allow-origin: https://dev-giaphu.github.io' /tmp/cors.headers
          grep -qi '^access-control-allow-credentials: true' /tmp/cors.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/cors.headers

          login_code=$(curl --silent --show-error --max-time 15 \
            -X POST "$API/api/store/auth/login" \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"smoke-${GITHUB_RUN_ID}@invalid.example\",\"password\":\"not-a-real-password\"}" \
            -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}')
          test "$login_code" = '401'
          grep -qi '^access-control-allow-origin: https://dev-giaphu.github.io' /tmp/login.headers
          grep -q '"code":"INVALID_CREDENTIALS"' /tmp/login.json
      - name: Verify deployed GitHub Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://dev-giaphu.github.io/lacvietgames-web/'
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "$SITE?smoke=${GITHUB_RUN_ID}" -o /tmp/deployed-index.html
          grep -q 'config.js?v=20260809-1340-page-aware-runtime' /tmp/deployed-index.html
          grep -q 'data-page="home"' /tmp/deployed-index.html
